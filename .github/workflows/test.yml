name: framework tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The validators are deliberately dependency-free so a cloned instance
      # can be checked with nothing installed. PyYAML is added here only as a
      # cross-check: ci_lib compares its strict parser against PyYAML and fails
      # if they disagree, which catches frontmatter drifting outside the
      # supported subset.
      - name: Install cross-check dependency
        run: python -m pip install --quiet pyyaml

      - name: Contract behaves as specified
        run: python3 tools/selftest.py

      - name: Fixtures validate clean
        run: python3 tools/validate.py fixtures --strict-warnings

      - name: Committed index is current
        run: python3 tools/build_index.py fixtures --check

      - name: Schemas are valid JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in sorted(glob.glob("schema/*.json")):
              try:
                  json.load(open(f))
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all schemas parse")
          PY

      - name: No real instance data committed to the public framework
        run: python3 tools/check_visibility.py . --allow-unknown

      - name: House style holds in the framework's own files
        run: |
          if grep -rInP '[\x{2013}\x{2014}]' \
               --include='*.md' --include='*.yaml' --include='*.json' \
               --include='*.py' . ; then
            echo "en/em dash found; house style forbids it"
            exit 1
          fi
          echo "no en/em dashes"
