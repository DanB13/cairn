# Instance configuration. Lives in the PRIVATE data repo only.
schema_version: 1
instance_name: Replace Me
profile: generic

# Who we are. REQUIRED, and the placeholders below deliberately FAIL validation
# until you fill them in: an instance that does not know its own size, stage and
# buyer criteria cannot tier competitors sensibly.
#
# Run /competeseed and it will interview you for these. Or fill them by hand.
#
# Why each field earns its place:
#   size, stage  calibrate which vendors are plausibly head to head. A seed-stage
#                company and a Series C company do not have the same tier 1.
#   industry     informs which profile to use. It is NOT the profile: a profile
#                is a tier and lane vocabulary, this is who you are.
#   icp.must_have_criteria
#                the source for every vendor page's "Gaps observed against stated
#                buyer criteria" section, so gaps are recorded against a stable
#                list rather than whatever the writer happened to remember.
#   competes_with_platforms
#                if true, the validator expects at least one platform_native
#                vendor, because bundled capability is usually the alternative
#                that never reaches a shortlist.
organisation:
  name: REPLACE_ME
  domain: REPLACE_ME
  industry: REPLACE_ME
  # One of: 1-10, 11-50, 51-200, 201-500, 501-1000, 1000+
  size: REPLACE_ME
  # One of: bootstrapped, pre-seed, seed, series-a, series-b, series-c-plus,
  #         growth, public, subsidiary
  stage: REPLACE_ME
  reviewed: 1970-01-01
  reverify_by: 1970-01-02
  competes_with_platforms: true
  icp:
    segments:
      - REPLACE_ME
    regions: []
    buyer_roles: []
    must_have_criteria:
      - REPLACE_ME

governance:
  # Curators own tiering, structure and schema changes. Low frequency, strategic.
  curators:
    - unassigned
  curator_deputy:
    - unassigned
  # Reviewers own the pull request queue. High frequency, clerical, plural on
  # purpose so review does not depend on one person being available.
  reviewers:
    - unassigned
  queue_ttl_days: 30
  triage_order: tier-weighted

paths:
  vendors: vendors
  signals: signals
  assessments: assessments
  archive: archive
  product: product
  brand: brand

# Shelf life per signal type, in days. Freshness is per data type because
# pricing goes stale far faster than a certification.
shelf_life_days:
  pricing: 180
  packaging: 180
  m-and-a: 90
  funding: 180
  leadership: 180
  headcount: 365
  product-launch: 270
  product-change: 270
  positioning: 270
  messaging: 270
  partnership: 365
  certification: 545
default_shelf_life_days: 365

retention:
  recent_moves_window_days: 365
  archive_after_days: 730

style:
  forbid_em_dash: true
  forbid_patterns: []
  max_claim_words: 80

collateral:
  # Rumour can never reach outbound collateral. This is the floor above that.
  min_confidence: likely
  require_provenance_appendix: true
  max_claim_age_days: 180

sources:
  trusted_origins: []
  # Only these origins may be tagged analyst-tier1.
  analyst_tier1: []
